[package]
name = "ummon-verifier"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Standalone CPU and wasm32 verifier for Ummon whole-model (.mdl1), recursive (.rec2/.rec1), cross-layer (.blk1), frontier attention (.mla1/.swa1), and beacon (.bcn4) receipts"

[workspace]

[lib]
name = "ummon_verifier"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ummon-verify"
path = "src/main.rs"

[dependencies]
stwo = { path = "../stwo/crates/stwo", default-features = false, features = ["std"] }
stwo-constraint-framework = { path = "../stwo/crates/constraint-framework", default-features = false, features = ["std"] }
bincode = "1"
blake2 = "0.10"
sha2 = "0.10"
num-traits = "0.2"

[features]
# Unit tests that need fixtures of the source repository, which are not in this release.
fixture-tests = []

[profile.release]
lto = true
codegen-units = 1
